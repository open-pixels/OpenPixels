# BOOTSTRAP TEMPLATE -- NOT A COPY OF WHAT IS ON THE SERVER.
# See the header of openpixels.app.conf; the same warning applies. Diff before
# you copy, or you will delete certbot's TLS block.

# app.openpixels.app -- the application itself.
#
# A single-page PWA. Everything here is static; there is no proxy block and
# there never will be one, because the product's central claim is that no
# server processes a photo. A deployment that adds a backend has broken it.
server {
    server_name app.openpixels.app;

    root /var/www/openpixels-app;
    index index.html;

    gzip on;
    # The ONNX weights are already compressed and the wasm barely benefits;
    # gzipping 500 MB of models would burn CPU for nothing. Text only.
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # 500 MB of model in one response, on a slow phone. The default 60s
    # send_timeout will cut that off partway through and the failure looks like
    # a corrupt model rather than a timeout.
    send_timeout 300s;

    # THREE MIME TYPES THAT ARE NOT OPTIONAL.
    #
    # 1. `.mjs` must be served as JavaScript. onnxruntime-web reaches its
    #    runtime through a dynamic import of an .mjs file, and a browser
    #    refuses a module served as application/octet-stream. This server's
    #    /etc/nginx/mime.types has no .mjs entry, so without this block the
    #    symptom is "Failed to fetch dynamically imported module" and a silent
    #    fall back to CPU -- or no inference at all. Nothing in the error
    #    points at a MIME type.
    # 2. `.wasm` must be application/wasm or streaming compilation is skipped
    #    and a 25 MB runtime is parsed the slow way. This one *is* already in
    #    the server's mime.types; it is named here so a future host without it
    #    is not a mystery.
    # 3. `.webmanifest` likewise has no default entry, and without it the PWA
    #    is not installable.
    location ~ \.mjs$ {
        include snippets/openpixels-security.conf;
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~ \.webmanifest$ {
        include snippets/openpixels-security.conf;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Pinned by sha256, never edited in place; a new model is a new filename.
    # The extension fetches these cross-origin, so the CORS pair is required
    # here as well as on the apex.
    location /models/ {
        include snippets/openpixels-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        types { application/octet-stream onnx; }
    }

    location /ort/ {
        include snippets/openpixels-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Content-hashed by the bundler, so it can be immutable.
    location /assets/ {
        include snippets/openpixels-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # A cached service worker is an app that can never be updated, and a
    # cached index.html keeps serving a build whose hashed assets are gone.
    location = /service-worker.js {
        include snippets/openpixels-security.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        include snippets/openpixels-security.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        include snippets/openpixels-security.conf;
        try_files $uri $uri/ /index.html;
    }

    # Nothing is ever uploaded to this server. Keep the limit small so that
    # stays true by construction rather than by convention.
    client_max_body_size 1m;

    listen 80;
    listen [::]:80;
}
