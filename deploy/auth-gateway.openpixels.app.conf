# BOOTSTRAP TEMPLATE -- NOT A COPY OF WHAT IS ON THE SERVER.
# certbot owns the `listen 443`, the certificate paths and the redirect blocks
# in the live files. Diff before you copy. See openpixels.app.conf's header.

# auth.openpixels.app and gateway.openpixels.app.
#
# Both are the shared OpenApps backend under an OpenPixels name. Same box,
# same service, same account and credit ledger -- sessions are bearer tokens
# rather than cookies, so nothing about identity is domain-scoped and a second
# hostname pointed at the same backend changes nothing functionally.
#
# What it changes is what a user is shown. Someone who installed OpenPixels
# has never heard of openapps.network, and it would otherwise surface in the
# two worst places: the address bar during sign-in, and -- far worse -- a
# browser permission prompt, which names whichever host the extension asks
# for. "OpenPixels wants to communicate with gateway.openapps.network" reads
# like the app is talking to a stranger's server, because it looks exactly
# like that.
#
# WHAT THIS DOES NOT HIDE. The server builds these once at startup from its
# own `public_url`, not per request, so they still name the backend:
#   - Google sign-in visibly bounces through accounts.openapps.network on the
#     OAuth callback hop.
#   - A wallet signature prompt names that host.
# Neither is a security property -- the server never checks either string
# against the request -- but neither is fixed by adding a hostname.

server {
    server_name auth.openpixels.app;

    # openapps-server: accounts, payments, the credit ledger.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
    listen [::]:80;
}

server {
    server_name gateway.openpixels.app;

    # openapps-gateway: holds the app key that turns a user's token into an
    # actual charge. The user token a client carries can read a balance and an
    # entitlement on its own, but can never spend -- only this service can.
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
    listen [::]:80;
}
