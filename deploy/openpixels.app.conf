# BOOTSTRAP TEMPLATE -- NOT A COPY OF WHAT IS ON THE SERVER.
#
# This is what a fresh host needs *before* certbot has ever run. Once certbot
# touches the live file it adds `listen 443 ssl`, the certificate paths and the
# HTTP->HTTPS redirect blocks, and those live only on the server.
#
# So this file is a starting point, never a newer version. Copying it over a
# certbot-managed config deletes the TLS block -- silently, because nginx keeps
# serving from memory until something reloads it. Diff before you copy:
#
#   ssh root@$DEPLOY_HOST 'cat /etc/nginx/sites-available/openpixels.app' \
#     | diff - deploy/openpixels.app.conf
#
# Anything shown as server-only is certbot's, and you would be destroying it.

# openpixels.app + www -- the marketing site.
#
# Static files, and one thing that is not: /models/. See below.
server {
    server_name openpixels.app www.openpixels.app;

    root /var/www/openpixels-site;
    index index.html;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # THE MODEL WEIGHTS ARE A PUBLIC API, AND THIS IS THEIR ADDRESS.
    #
    # The browser extension fetches weights from https://openpixels.app/models/
    # -- the apex, not app. -- because a store package cannot carry half a
    # gigabyte. That URL is baked into every released extension
    # (apps/extension/vite.config.js), so it has to keep working here even
    # though the apex is otherwise just a marketing page.
    #
    # One copy on disk, served under both hostnames. `alias` rather than a
    # redirect: a cross-origin 301 on a CORS fetch is fragile, and this costs
    # nothing.
    #
    # NEVER rename or remove a file an already-released extension asks for. A
    # new model is a new filename and a new extension version.
    location /models/ {
        alias /var/www/openpixels-app/models/;
        include snippets/openpixels-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Pinned by sha256 and never edited in place, so it can be cached
        # forever. The extension fetches these cross-origin, hence the CORS
        # pair -- without them the extension silently cannot load a model.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        types { application/octet-stream onnx; }
    }

    # Short, so a copy change is live in minutes rather than after a visitor's
    # cache has expired.
    location = /index.html {
        include snippets/openpixels-security.conf;
        add_header Cache-Control "public, max-age=300" always;
    }
    location = /privacy.html {
        include snippets/openpixels-security.conf;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Not fingerprinted, so a week rather than a year: swapping a screenshot
    # should not need a cache bust, and they are small.
    location ~* \.(png|jpg|svg|ico|webp)$ {
        include snippets/openpixels-security.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        include snippets/openpixels-security.conf;
        try_files $uri $uri/ =404;
    }

    listen 80;
    listen [::]:80;
}
