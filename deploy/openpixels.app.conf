# OpenPixels — a static site, with three headers that are not optional.
#
# 1. `.mjs` must be served as JavaScript. onnxruntime-web reaches its
#    runtime through a dynamic import of an .mjs file, and a browser refuses
#    a module served as application/octet-stream. The symptom is
#    "Failed to fetch dynamically imported module" and a fallback to CPU, or
#    no inference at all — nothing that points at a MIME type.
# 2. `.wasm` must be application/wasm, or streaming compilation is skipped
#    and a 25 MB runtime is parsed the slow way.
# 3. The models must be cached hard and the HTML not at all. The weights are
#    checksummed and never change; index.html changes every deploy, and a
#    cached one keeps serving a build whose hashed assets are gone.

types {
    application/wasm            wasm;
    text/javascript             mjs js;
    application/manifest+json   webmanifest;
    font/woff2                  woff2;
    application/octet-stream    onnx;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openpixels.app www.openpixels.app;

    ssl_certificate     /etc/letsencrypt/live/openpixels.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openpixels.app/privkey.pem;

    root /var/www/openpixels;
    index index.html;

    gzip on;
    gzip_types text/css text/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
    # The ONNX weights are already compressed; gzipping them burns CPU for
    # nothing. Serve pre-compressed .br/.gz files where they exist instead.
    gzip_proxied any;

    # The one header the privacy claim depends on being *absent*: no
    # third-party origins are permitted, so a future dependency that phones
    # home fails loudly here rather than silently in a user's browser.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /service-worker.js {
        # A cached service worker is a site that can never be updated.
        add_header Cache-Control "no-cache" always;
    }

    location /models/ {
        # Pinned by sha256 and never edited in place; a new model is a new
        # filename. The extension fetches these cross-origin.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        types { application/octet-stream onnx; }
    }

    location /ort/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /assets/ {
        # Content-hashed by the bundler.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name openpixels.app www.openpixels.app;
    return 301 https://openpixels.app$request_uri;
}
