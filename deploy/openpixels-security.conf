# Security headers for openpixels.app and app.openpixels.app.
#
# WHY THIS IS A SNIPPET AND NOT FIVE LINES IN THE SERVER BLOCK
#
# nginx's `add_header` does not accumulate down the tree: a `location` that
# contains *any* `add_header` inherits *none* from its parent. Every location
# below sets a Cache-Control, so without an `include` in each one, the
# security headers would silently vanish from exactly the responses that
# matter -- the app shell and every asset. `nginx -t` does not catch it and
# the page still loads, so nothing looks wrong until the headers are checked
# directly with `curl -I`.
#
# THE ONE DIRECTIVE THE PRIVACY CLAIM DEPENDS ON
#
# `connect-src 'self'` is the load-bearing one. The product's central claim is
# that a photo never leaves the device, and this is what makes a future
# dependency that tries to phone home fail loudly in the browser rather than
# quietly succeed. Do not widen it. There is no analytics endpoint, no error
# reporter and no CDN to add -- if one ever seems necessary, that is a product
# decision to be argued out before it is a config change.
#
# WHY 'unsafe-inline' IS HERE AND IS NOT SLOPPINESS
#
# Both pages carry an inline <script> and an inline <style>: the app's built
# index.html registers its service worker inline, and the marketing page keeps
# its CSS and its comparison slider inline so the whole site is one request
# with no third-party origin. Hashing them was considered and rejected -- the
# app's inline block is regenerated by every build, so a stale hash would
# break the service worker registration silently, which is a miserable thing
# to debug for no real gain. These are static pages with no user-supplied
# content and no third-party script, so the XSS surface 'unsafe-inline' would
# widen does not exist here.
#
# 'wasm-unsafe-eval' is required, not optional: onnxruntime-web compiles its
# WebAssembly at runtime, and without it no model loads at all.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
