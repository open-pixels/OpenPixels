[workspace]
resolver = "2"
members = ["crates/pixels-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/openapps/openpixels"

[workspace.dependencies]
pixels-core = { path = "crates/pixels-core" }

# Resampling only. No decoders: the browser decodes through
# createImageBitmap, which also applies EXIF orientation for free.
image = { version = "0.25", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Pinned exactly: wasm-bindgen and its CLI verify each other's version and
# refuse to run when they differ. Bump this and the CLI install together.
wasm-bindgen = "=0.2.126"
console_error_panic_hook = "0.1"

[profile.release]
lto = "thin"
strip = "symbols"
opt-level = 3
